<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Dwenyx — Content Creator. YouTube, TikTok, jeux Roblox et collabs."><meta property="og:title" content="Dwenyx"><meta property="og:description" content="Content Creator — YouTube, TikTok, jeux Roblox et collabs."><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Dwenyx V2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout : fond en grille de "studs" violets, logo Dwenyx animé (emblème D + lettres-briques), carte profil avec bannière + menu à onglets */
:root{
  --bg:#0e0a17;
  --surface:#171128;
  --surface-2:#211936;
  --ink:#f8f5ff;
  --muted:#a89cc6;
  --line:#33285170;
  --line-solid:#332851;
  --accent:#9b5cff;
  --accent-deep:#5b2ad1;
  --lilac:#d8c6ff;
  --white:#ffffff;
  --ok:#7ce8b0;
  --f-display:"Bungee","Arial Black",Impact,sans-serif;
  --f-body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Space Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
html{overflow-y:scroll;scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:var(--accent) transparent}
html::-webkit-scrollbar{width:8px}
html::-webkit-scrollbar-thumb{background:var(--accent);border-radius:8px}
html::-webkit-scrollbar-track{background:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
#studs{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* ===== Logo Dwenyx ===== */
.emblem{display:block;overflow:visible}
.emblem .tile{fill:var(--accent);transform-origin:50px 50px;transform:rotate(12deg)}
.emblem .tile-shade{fill:var(--accent-deep);transform-origin:50px 50px;transform:rotate(12deg) translate(0,5px)}
.emblem .d{fill:var(--white);stroke:var(--white);stroke-width:2.5;stroke-linejoin:round}
.emblem .stud{fill:var(--white);opacity:.9}
.emblem .orbit{fill:none;stroke:var(--lilac);stroke-width:1.2;stroke-dasharray:2 6;opacity:.6;transform-origin:50px 50px}
.emblem .spark{fill:var(--white);transform-origin:50px 50px}

/* Animation d'intro (écran d'entrée) */
.intro .tile,.intro .tile-shade{animation:tileIn .9s cubic-bezier(.3,1.6,.5,1) both}
.intro .d{stroke-dasharray:260;stroke-dashoffset:260;fill-opacity:0;
  animation:draw 1s .5s ease-out forwards,fill .4s 1.3s ease-out forwards}
.intro .stud{animation:pop .35s both}
.intro .stud:nth-of-type(1){animation-delay:1.3s}.intro .stud:nth-of-type(2){animation-delay:1.4s}
.intro .stud:nth-of-type(3){animation-delay:1.5s}.intro .stud:nth-of-type(4){animation-delay:1.6s}
.intro .orbit{animation:spin 14s linear infinite}
.intro .spark{animation:spin 4s linear infinite}
.intro .float{animation:float 3.2s 1.8s ease-in-out infinite;transform-origin:50px 50px}
@keyframes tileIn{from{transform:rotate(-200deg) scale(0)}to{transform:rotate(12deg) scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fill{to{fill-opacity:1}}
@keyframes pop{from{transform:scale(0);transform-origin:center;transform-box:fill-box}to{transform:scale(1);transform-box:fill-box}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-5px) rotate(-3deg)}}

/* Mot DWENYX en briques */
.wordmark{display:flex;gap:.04em;font-family:var(--f-display);font-size:clamp(38px,11vw,80px);line-height:1;margin:0;font-weight:400}
.wordmark span{display:inline-block;color:var(--white);
  text-shadow:0 .05em 0 var(--lilac),0 .1em 0 var(--accent),0 .15em 0 var(--accent-deep),0 .25em .3em rgba(0,0,0,.5)}
.wordmark span.v{color:var(--accent);text-shadow:0 .05em 0 #7d43f0,0 .1em 0 var(--accent-deep),0 .15em 0 #3b1690,0 .25em .3em rgba(0,0,0,.5)}
.intro .wordmark span{animation:brick .6s cubic-bezier(.3,1.5,.5,1) both}
@keyframes brick{from{transform:translateY(-120vh) rotate(-8deg)}to{transform:none}}
.wave span{animation:wave 2.6s ease-in-out infinite}
@keyframes wave{0%,70%,100%{transform:none}35%{transform:translateY(-.12em)}}

/* Écran d'entrée */
#gate{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;gap:22px;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 42%,#2a1650 0,var(--bg) 60%);cursor:pointer;transition:transform .8s cubic-bezier(.7,0,.2,1)}
#gate.gone{transform:translateY(-100%)}
#gate .emblem{width:clamp(110px,28vw,160px);height:auto}
#gate p{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin:0;letter-spacing:.2em;text-transform:uppercase;
  opacity:0;animation:appear .5s 1.1s forwards,bob 1.4s 1.6s ease-in-out infinite}
@keyframes appear{to{opacity:1}}
@keyframes bob{50%{transform:translateY(-4px);color:var(--white)}}

.panes{overflow:hidden;transition:height .35s cubic-bezier(.2,.8,.2,1)}
.pane{animation:paneIn .3s ease-out}
@keyframes paneIn{from{opacity:0;transform:translateY(6px)}}
main{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-block:40px;gap:14px}

.card{width:100%;max-width:480px;background:var(--surface);border:2px solid var(--line-solid);border-radius:18px;overflow:hidden;
  box-shadow:0 6px 0 var(--line-solid),0 30px 70px -20px rgba(91,42,209,.45)}

.banner{position:relative;overflow:hidden;background:var(--accent-deep);padding:14px 20px 60px;display:flex;flex-direction:column;gap:12px}
.banner{background:linear-gradient(120deg,#3b1690,var(--accent-deep),var(--accent),#7a3cf0,#3b1690);background-size:300% 300%;animation:bannerShift 12s ease-in-out infinite}
@keyframes bannerShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.banner::before,.banner::after{content:"";position:absolute;border-radius:50%;pointer-events:none;filter:blur(28px)}
.banner::before{width:220px;height:220px;left:-60px;top:-90px;background:rgba(255,255,255,.35);animation:blobA 9s ease-in-out infinite}
.banner::after{width:260px;height:260px;right:-80px;bottom:-140px;background:rgba(216,198,255,.45);animation:blobB 11s ease-in-out infinite}
@keyframes blobA{0%,100%{transform:translate(0,0)}50%{transform:translate(180px,60px)}}
@keyframes blobB{0%,100%{transform:translate(0,0)}50%{transform:translate(-200px,-40px)}}
.banner .shine{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.banner .shine::before{content:"";position:absolute;top:-50%;bottom:-50%;width:60px;left:-30%;transform:rotate(20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);animation:sweep 5s ease-in-out infinite}
@keyframes sweep{0%,55%{left:-30%}100%{left:130%}}
.banner > :not(.shine){position:relative;z-index:1}
.banner .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-mono);font-size:10px;color:var(--lilac);text-transform:uppercase;letter-spacing:.12em}
.badge-lv{font-family:var(--f-mono);font-size:11px;font-weight:700;background:rgba(14,10,23,.45);
  color:var(--white);padding:4px 8px;border-radius:6px;border:1px solid rgba(216,198,255,.45);letter-spacing:0}

.head{display:flex;align-items:flex-end;gap:14px;padding:0 20px;margin-top:-46px;position:relative;z-index:2}
.avatar{width:94px;height:94px;flex:none;border-radius:22px;background:var(--accent);border:4px solid var(--surface);
  display:grid;place-items:center;overflow:hidden;position:relative;box-shadow:0 0 0 2px var(--accent),0 0 24px -4px var(--accent)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar .letter{font-family:var(--f-display);font-size:48px;line-height:1;color:var(--white)}
.bio{margin:0;padding:14px 20px 0;line-height:1.55;color:var(--ink);max-width:62ch}
.who{min-width:0;padding-bottom:6px}
.who .wordmark{font-size:26px}
.who .wordmark span{text-shadow:0 2px 0 var(--accent),0 4px 0 var(--accent-deep)}
.who .wordmark span,.who .wordmark span.v{color:var(--white);text-shadow:0 2px 0 var(--accent),0 4px 0 var(--accent-deep),0 0 12px rgba(155,92,255,.85)}
.who .wordmark{animation:nameGlow 2.6s ease-in-out infinite}
@keyframes nameGlow{0%,100%{filter:drop-shadow(0 0 4px rgba(155,92,255,.5))}50%{filter:drop-shadow(0 0 14px rgba(178,128,255,1))}}
.who .h{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:6px}
.role svg{width:14px;height:14px;fill:var(--white);flex:none}
.role{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:4px 10px;border-radius:999px;background:var(--accent);color:var(--white);
  font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 2px 0 var(--accent-deep)}
.online{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;color:var(--ok);margin-top:4px}
.online i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 7px transparent}}

.xp{padding:14px 20px 0;display:flex;flex-direction:column;gap:6px}
.xp .l{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.xp .bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line-solid)}
.xp .l strong{color:var(--white);font-weight:700}
.xp .l span:last-child{font-variant-numeric:tabular-nums;color:var(--lilac)}
.xp .bar b{display:block;height:100%;min-width:8px;border-radius:99px;transition:width 1.4s cubic-bezier(.2,.8,.2,1);
  background:linear-gradient(90deg,var(--accent-deep),var(--accent),var(--white),var(--accent));background-size:300% 100%;animation:xp 4s linear infinite}
@keyframes xp{to{background-position:-300% 0}}

/* Compteurs cumulés (dans la bannière) */
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tnum{text-align:center;min-width:0}
.tnum b{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(20px,6vw,28px);color:var(--white);
  text-shadow:0 3px 0 rgba(14,10,23,.45);font-variant-numeric:tabular-nums;line-height:1.1}
.tnum span{font-family:var(--f-mono);font-size:10px;color:var(--lilac);text-transform:uppercase;letter-spacing:.1em}
.tnum + .tnum{border-left:1px solid rgba(255,255,255,.18)}
.tnum{position:relative}
.tnum b.bump{animation:bump .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.18);color:var(--lilac)}100%{transform:scale(1)}}
.delta{position:absolute;left:50%;top:-4px;transform:translateX(-50%);font-family:var(--f-mono);font-size:11px;font-weight:700;
  padding:2px 6px;border-radius:6px;pointer-events:none;animation:deltaUp 2.2s ease-out forwards;white-space:nowrap}
.delta.up{background:var(--ok);color:#0b2416}
.delta.down{background:#ff7a8a;color:#2a0710}
@keyframes deltaUp{0%{opacity:0;transform:translate(-50%,6px)}15%{opacity:1;transform:translate(-50%,-6px)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-22px)}}
.banner .live{position:absolute;right:14px;top:10px;display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.1em;color:var(--white);background:rgba(14,10,23,.45);padding:3px 8px;border-radius:6px}
.banner .live[hidden]{display:none}
.banner .live i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:ping 2s infinite}
.banner{padding-top:30px}
.split{display:flex;flex-direction:column;gap:6px}
.split .r{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,auto);gap:10px;align-items:center;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.split .r b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;text-align:right;min-width:52px}
.split .r .n{display:flex;align-items:center;gap:6px;color:var(--ink);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.split .r .n i{width:8px;height:8px;border-radius:2px;flex:none}
.split .r.h{font-size:9px;text-transform:uppercase;letter-spacing:.08em}
.split .r.h b{color:var(--muted);font-weight:400}

/* Menu à onglets */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:16px 20px 0}
.tab{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-2);border:2px solid var(--line-solid);
  border-radius:10px;padding:9px 4px;cursor:pointer;transition:transform .1s,color .15s;box-shadow:0 3px 0 var(--line-solid)}
.tab:hover{color:var(--ink)}
.tab:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line-solid)}
.tab[aria-selected="true"]{color:var(--white);background:var(--accent);border-color:var(--accent);box-shadow:0 3px 0 var(--accent-deep)}
.tab:focus-visible{outline:2px solid var(--white);outline-offset:2px}

.pane{padding:18px 20px 22px;display:flex;flex-direction:column;gap:10px}
.pane p{margin:0;line-height:1.55}
.pane .sub{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border:1px solid var(--line-solid);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--white);text-shadow:0 2px 0 var(--accent);font-variant-numeric:tabular-nums}
.stat span{font-family:var(--f-mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.skills{display:flex;flex-wrap:wrap;gap:6px}
.skill{font-family:var(--f-mono);font-size:11px;padding:5px 9px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line-solid);color:var(--lilac)}

.lnk{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;background:var(--surface-2);border:2px solid var(--line-solid);
  color:var(--ink);text-decoration:none;font:inherit;text-align:left;width:100%;cursor:pointer;transition:border-color .15s,transform .1s}
.lnk:hover,.lnk:focus-visible{border-color:var(--c,var(--accent));outline:none;transform:translateX(3px)}
.lnk .ic{width:38px;height:38px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--c,var(--accent))}
.lnk .ic svg{width:20px;height:20px;fill:#fff}
.lnk .t{flex:1;min-width:0}
.lnk b{display:block;font-size:14px}
.lnk small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnk .go{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.lnk .subs{flex:none;display:flex;flex-direction:column;align-items:flex-end;line-height:1.1;text-align:right}
.lnk .subs b{font-family:var(--f-display);font-weight:400;font-size:17px;color:var(--white);font-variant-numeric:tabular-nums}
.lnk .subs i{font-style:normal;font-family:var(--f-mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.lnk.copied{border-color:var(--ok);background:rgba(124,232,176,.16);transition:background .2s,border-color .2s}
.lnk.copied .ic{background:var(--ok)}
.lnk.copied .go,.lnk.copied small{color:var(--ok)}

.proj{display:flex;flex-direction:column;gap:10px}
.folders,.pjs{display:flex;flex-direction:column;gap:8px}
.folder{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--surface-2);border:2px solid var(--line-solid);
  color:var(--ink);font:inherit;text-align:left;width:100%;cursor:pointer;transition:border-color .15s,transform .1s}
.folder:hover,.folder:focus-visible{border-color:var(--accent);outline:none;transform:translateX(3px)}
.folder .fi{width:40px;height:40px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--accent)}
.folder .fi svg{width:22px;height:22px;fill:var(--white)}
.folder .t{flex:1;min-width:0}
.folder b{display:block;font-size:14px}
.folder small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.folder .go{font-family:var(--f-mono);font-size:11px;color:var(--lilac)}
.back{align-self:flex-start;font-family:var(--f-mono);font-size:12px;color:var(--lilac);background:none;border:0;padding:4px 0;cursor:pointer}
.back:hover,.back:focus-visible{color:var(--white);outline:none;text-decoration:underline}
.crumb{display:flex;align-items:center;gap:8px;font-size:15px}
.crumb svg{width:18px;height:18px;fill:var(--accent)}
.pj{background:var(--surface-2);border:2px solid var(--line-solid);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pj .shot{position:relative;aspect-ratio:768/429;max-width:100%;background:var(--bg)}
.pj .shot img{width:100%;height:100%;object-fit:cover;display:block}
.pj .shot .st{position:absolute;left:10px;top:10px;background:rgba(14,10,23,.8)}
.pj .info{padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pj b{font-size:15px}
.pj .d{font-size:12px;color:var(--muted);line-height:1.45}
.pj .shot .visits{position:absolute;right:10px;top:10px;display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px;
  background:rgba(14,10,23,.8);font-family:var(--f-mono);font-size:10px;font-weight:700;color:var(--white);text-transform:uppercase;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.pj .shot .visits svg{width:12px;height:12px;fill:var(--lilac)}
.ld{display:inline-flex;gap:3px;align-items:center;padding:0 2px}
.ld i{width:5px;height:5px;border-radius:50%;background:var(--white);animation:ld 1s ease-in-out infinite}
.ld i:nth-child(2){animation-delay:.15s}.ld i:nth-child(3){animation-delay:.3s}
@keyframes ld{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.pj .play{margin-top:6px}
.pj .st{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;align-self:flex-start;padding:3px 7px;border-radius:6px}
.st.dev{background:rgba(155,92,255,.18);color:var(--lilac)}
.st.live{background:rgba(124,232,176,.14);color:var(--ok)}

label{display:flex;flex-direction:column;gap:5px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
input,select,textarea{font:inherit;font-family:var(--f-body);font-size:14px;color:var(--ink);background:var(--bg);border:2px solid var(--line-solid);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.btn{font-family:var(--f-display);font-size:14px;padding:12px 14px;border-radius:12px;border:0;cursor:pointer;background:var(--accent);color:var(--white);
  box-shadow:0 4px 0 var(--accent-deep);transition:transform .1s;text-decoration:none;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.btn:focus-visible{outline:2px solid var(--white);outline-offset:3px}
.btn.alt{background:var(--white);color:var(--accent-deep);box-shadow:0 4px 0 var(--lilac)}
.out{font-family:var(--f-mono);font-size:12px;white-space:pre-wrap;background:var(--bg);border:2px dashed var(--line-solid);border-radius:10px;padding:12px;user-select:all}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1}

footer{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:30;
  background:var(--white);color:var(--accent-deep);font-family:var(--f-mono);font-weight:700;font-size:12px;padding:10px 16px;border-radius:10px;
  box-shadow:0 4px 0 var(--accent);transition:.2s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* Stats cumulées */
const fmt=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?0:1).replace(".",",")+" M":n>=1e3?(n/1e3).toFixed(n>=1e4?0:1).replace(".",",")+" k":String(Math.round(n));

/* Le chiffre défile de l'ancienne valeur à la nouvelle */
function tween(el,from,to,f,dur){
  cancelAnimationFrame(el._raf);
  if(reduceMotion||from===to){el.textContent=f(to);return}
  const t0=performance.now();
  (function step(now){const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=f(from+(to-from)*e);if(k<1)el._raf=requestAnimationFrame(step)})(t0);
}
/* Petit "+123" qui s'envole quand un chiffre change en direct */
function bump(el,diff){
  if(!diff)return;
  el.classList.remove("bump");el.offsetWidth;el.classList.add("bump");
  const tag=document.createElement("span");tag.className="delta "+(diff>0?"up":"down");
  tag.textContent=(diff>0?"+":"−")+fmt(Math.abs(diff));el.parentElement.append(tag);setTimeout(()=>tag.remove(),2200);
}

const STEP=10000;

  $("goalLabel").textContent=fr(goal);$("goalCount").textContent=`${fr(subs)} / ${fr(goal)}`;
  $("goalBar").setAttribute("aria-valuenow",Math.round(pct));$("goalFill").style.width=pct+"%";
}
function renderTotals(next,live){

}

function draw(t=0){
  const d=devicePixelRatio,g=24*d,r=3.5*d;cx.clearRect(0,0,W,H);
  const M=Math.max(W,H);
  const gl=GLOWS.map(o=>({x:(o.x+Math.sin(t*o.sx+o.p)*.18)*W,y:(o.y+Math.cos(t*o.sy+o.p)*.15)*H,r:o.r*M*(1+Math.sin(t*.0006+o.p)*.12),c:o.c}));
  cx.globalCompositeOperation="lighter";
  for(const o of gl){const gr=cx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);
    gr.addColorStop(0,`rgba(${o.c},.22)`);gr.addColorStop(.5,`rgba(${o.c},.07)`);gr.addColorStop(1,`rgba(${o.c},0)`);
    cx.fillStyle=gr;cx.fillRect(o.x-o.r,o.y-o.r,o.r*2,o.r*2)}
  cx.globalCompositeOperation="source-over";
  const ox=(mx-.5)*g*.6,oy=(my-.5)*g*.6;
  for(let y=-g;y<H+g;y+=g)for(let x=-g;x<W+g;x+=g){
    const px=x+ox,py=y+oy;
    const dist=Math.hypot(px-mx*W,py-my*H)/(M*.5);
    let lit=0;for(const o of gl){const k=1-Math.hypot(px-o.x,py-o.y)/o.r;if(k>0)lit+=k*k*.18}
    const a=Math.max(0,.24-dist*.2)+Math.min(.22,lit);
    cx.beginPath();cx.arc(px,py,r,0,7);cx.fillStyle=`rgba(155,92,255,${a+.035})`;cx.fill();
    cx.beginPath();cx.arc(px-r*.25,py-r*.25,r*.45,0,7);cx.fillStyle=`rgba(255,255,255,${a*.35})`;cx.fill();
  }
  if(!still)requestAnimationFrame(draw);
}
size();if(!still)draw();
</script>
