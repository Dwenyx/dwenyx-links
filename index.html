<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2f62f2">
<meta name="description" content="Paint Clash — capture le clavier géant avec ta main, mode Party et Classé.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>body{margin:0}</style>
<title>Paint Clash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>
/* Layout: jeu mobile plein écran — scène 3D (île / arène) derrière, onglets en panneaux, barre de navigation en bas avec gros bouton rond central */
:root{
  --ink:#122a6b; --sky1:#45e0f2; --sky2:#2f8cf5; --royal:#2f62f2; --royalD:#1f44c9; --deep:#1a3aa8;
  --yellow:#ffd21f; --yellowD:#f2a100; --green:#6ade4a; --greenD:#2fae2c; --pink:#ff8ec4; --pinkD:#e85a9c;
  --red:#ff5a63; --redD:#c8283a; --white:#ffffff; --muted:#cfe0ff; --navbg:#e9f3ff;
  --font:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;margin:0}
body{background:var(--sky2);color:var(--white);font-family:var(--font);letter-spacing:.02em;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 55%,var(--sky1),var(--sky2) 75%)}
.halo{position:absolute;left:50%;top:42%;width:560px;height:560px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,243,107,.9) 0 16%,rgba(255,243,107,0) 48%),radial-gradient(circle,rgba(255,255,255,.95) 1.6px,transparent 2.2px) 0 0/13px 13px;-webkit-mask:radial-gradient(circle,#000 25%,transparent 66%);mask:radial-gradient(circle,#000 25%,transparent 66%);opacity:0;transition:opacity .3s}
body[data-r] .halo{opacity:1}
body[data-r="0"] #bg{background:linear-gradient(#2a6ff0,#4fd6f7 62%)}
body[data-r="1"] #bg{background:linear-gradient(#1f9b3a,#9cf05a 62%)}
body[data-r="2"] #bg{background:linear-gradient(#5a22c8,#d590ff 62%)}
body[data-r="3"] #bg{background:linear-gradient(#ee5a14,#ffd21f 62%)}
#detail{position:fixed;inset:0;z-index:8;pointer-events:none;display:flex;flex-direction:column;padding-top:calc(env(safe-area-inset-top,0px) + 92px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
#detail button{pointer-events:auto}
.dhead{display:grid;grid-template-columns:46px minmax(0,1fr) 68px;align-items:center;gap:10px;width:min(100%,460px);margin:0 auto}
.eqmark{width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
.eqmark img{width:50px;height:50px}
.dban{position:relative;height:60px;border-radius:16px;border:4px solid #fff;box-shadow:0 0 0 3px var(--ink),0 6px 0 var(--ink);background:linear-gradient(90deg,var(--c1),var(--c2));display:grid;place-items:center;min-width:0}
.dban h2{margin:0;font-size:clamp(24px,8vw,34px);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 8px}
.role{position:absolute;left:8px;top:-20px;display:flex;align-items:center;gap:4px;background:var(--c1);border:3px solid #fff;box-shadow:0 0 0 2px var(--ink);border-radius:999px;padding:1px 10px 1px 2px;font-size:14px;white-space:nowrap}
.role svg{width:20px;height:20px;background:#fff;border-radius:50%;padding:1px}
.dlv{text-align:center;line-height:.95;display:flex;flex-direction:column}
.dlv small{font-size:15px}.dlv b{font-weight:400;font-size:42px}
.dmid{flex:1;position:relative;min-height:120px}
.arrow{position:absolute;top:46%;width:46px;height:60px;display:grid;place-items:center;transform:translateY(-50%)}
.arrow svg{width:34px;height:46px}
.arrow:active{transform:translateY(-50%) scale(.85)}
.arrow.l{left:0}.arrow.r{right:0}
.dab{display:flex;align-items:center;gap:14px;width:min(100%,380px);margin:0 auto 34px}
.abi{position:relative;width:74px;height:74px;flex:none;border-radius:16px;border:3px solid #fff;box-shadow:0 0 0 3px var(--ink),0 5px 0 var(--ink),inset 0 -6px 0 rgba(0,0,0,.2);display:grid;place-items:center}
.abi svg{width:46px;height:46px}
.abi .mx{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:16px;color:var(--yellow)}
.abi em{position:absolute;bottom:-12px;left:4px;font-style:normal;font-size:17px;white-space:nowrap}
.abt{flex:1;min-width:0}
.abt h3{margin:0 0 2px;font-size:22px;font-weight:400}
.abt p{margin:0 0 6px;font-size:13px;color:#eef4ff}
.seg{position:relative;display:grid;grid-template-columns:repeat(10,1fr);gap:3px;padding:4px;background:var(--ink);border-radius:12px;box-shadow:0 0 0 3px #fff}
.seg i{height:22px;border-radius:5px;background:#2443b0}
.seg i.on{background:linear-gradient(#fff07a,#ffbf1a);box-shadow:inset 0 -4px 0 #d88a00}
.seg i.next{background:linear-gradient(#a2f25e,#4cc72a);box-shadow:inset 0 -4px 0 #2b8f1d;animation:blink .8s infinite alternate}
@keyframes blink{to{filter:brightness(1.3)}}
.bub{position:absolute;top:calc(100% + 8px);transform:translateX(-50%);background:linear-gradient(#a2f25e,#4cc72a);border:2px solid #fff;box-shadow:0 0 0 2px var(--ink);border-radius:10px;padding:0 8px;font-size:15px;white-space:nowrap}
.dbtns{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;width:min(100%,440px);margin:0 auto}
.dbtn{min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(18px,6vw,26px);line-height:1.05;padding:8px 6px}
.dbtn small{font-size:15px}
.dbtn b{font-weight:400;display:flex;align-items:center;gap:4px;white-space:nowrap}
.dbtn b .ic{width:26px;height:26px}
.dbtn.is-eq{opacity:.8}
#cv{position:fixed;inset:0;width:100%;height:100%;z-index:1;display:block;touch-action:none}
button{font-family:var(--font);color:var(--white);cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--white);outline-offset:3px}
.s{text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 4px 0 var(--ink)}
.btn{--img:url(ui/btn_blue.png);position:relative;border-style:solid;border-color:transparent;border-width:13px 15px 17px;border-image:var(--img) 30 34 38 34 fill stretch;background:none;padding:0 4px;min-height:52px;font-size:20px;color:#fff;transition:transform .08s,filter .08s;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 3px 0 var(--ink)}
.btn:active,.btn.press{transform:translateY(3px) scale(.97);filter:brightness(.92)}
.btn-blue{--img:url(ui/btn_blue.png)}
.btn-green{--img:url(ui/btn_green.png)}
.btn-yellow{--img:url(ui/btn_yellow.png)}
.btn-red{--img:url(ui/btn_red.png)}
.btn-grey{--img:url(ui/btn_grey.png)}
.btn-premium{--img:url(ui/btn_pink.png)}
.btn[disabled]{cursor:default}
.btn[disabled]:not(.is-eq){--img:url(ui/btn_grey.png)}
.btn[disabled]:active{transform:none;filter:none}
.ib{width:58px;height:58px;background:center/contain no-repeat;flex:none;transition:transform .08s}
.ib:active{transform:scale(.88)}
.ib-x{background-image:url(ui/i_x.png)}
img.u{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none;user-select:none}
.sqx{width:58px;height:58px;padding:0;display:grid;place-items:center;flex:none}
.sqx svg{width:26px;height:26px}
.stitle{position:relative;display:inline-block;line-height:1.05}
.stitle span{display:block}
.stitle .b1,.stitle .b2{position:absolute;inset:0;color:transparent}
.stitle .b1{-webkit-text-stroke:14px var(--ink);transform:translateY(5px)}
.stitle .b2{-webkit-text-stroke:8px #fff}
.stitle .f{position:relative;background:linear-gradient(#fff36b 10%,#ffb21f 50%,#ff6a1a 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{position:relative;display:inline-flex;align-items:center;gap:6px;background:var(--deep);border-radius:999px;padding:3px 14px 3px 4px;font-size:18px;font-variant-numeric:tabular-nums;box-shadow:inset 0 3px 0 rgba(0,0,0,.2)}
.ic{display:inline-block;width:26px;height:26px;flex:none}
.ic svg{width:100%;height:100%;display:block}
.pill .plus{position:absolute;left:20px;bottom:-5px;width:18px;height:18px;border-radius:50%;background:var(--green);border:2px solid var(--ink);font-size:14px;line-height:12px;color:#fff;display:grid;place-items:center}
.screen{position:fixed;inset:0;z-index:5;pointer-events:none}
.screen button,.screen input{pointer-events:auto}
.cube{position:relative;border-radius:30%;border:3px solid var(--ink);box-shadow:inset -6px -8px 0 rgba(0,0,0,.16),inset 6px 6px 0 rgba(255,255,255,.35)}
.cube i{position:absolute;top:30%;width:22%;height:30%;background:#fff;border:2.5px solid var(--ink);border-radius:50%}
.cube i::after{content:"";position:absolute;width:45%;height:45%;background:var(--ink);border-radius:50%;left:30%;top:40%}
.cube i:first-child{left:20%}.cube i:last-child{right:20%}

/* ACCUEIL */
.topbar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:10px;transition:background .2s;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));z-index:7;pointer-events:none}
.topbar button{pointer-events:auto}
body[data-tab]:not([data-tab="home"]) .topbar{background:var(--royalD);box-shadow:0 3px 0 var(--ink)}
body[data-r] .topbar{background:transparent!important;box-shadow:none!important}
.topbar .mid{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.avatar{width:50px;height:50px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;box-shadow:0 3px 0 var(--ink)}
.avatar .cube{width:30px;height:30px;border-width:2px}
.avatar .cube i{border-width:1.5px}
.gear{width:46px;height:46px;display:grid;place-items:center}
.gear svg,.gear img{width:42px;height:42px}
.region{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 112px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;width:min(78%,300px)}
.region .nm{font-size:28px;white-space:nowrap}
.rbar{width:100%;height:40px;border-radius:999px;background:#fff;border:3px solid var(--ink);padding:4px;box-shadow:0 4px 0 var(--ink)}
.rbar>div{position:relative;height:100%;border-radius:999px;background:var(--deep);overflow:hidden}
.rbar b{position:absolute;inset:0 auto 0 0;border-radius:999px;transition:width .8s cubic-bezier(.2,1.2,.4,1);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15),inset 0 3px 0 rgba(255,255,255,.4)}
.rbar .t{position:absolute;inset:0;display:grid;place-items:center;font-size:22px}
.modes{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 128px);display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.mcard{width:42%;max-width:220px;height:118px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;padding:0 10px 12px;border:3px solid var(--ink);position:relative;transition:transform .1s}
.mcard.party{border-left:0;border-radius:0 26px 26px 0;background:linear-gradient(#ffb3d6,var(--pink));box-shadow:inset 0 -6px 0 var(--pinkD),0 4px 0 var(--ink);padding-left:max(10px,env(safe-area-inset-left,0px))}
.mcard.rank{border-right:0;border-radius:26px 0 0 26px;background:linear-gradient(#ff8a90,var(--red));box-shadow:inset 0 -6px 0 var(--redD),0 4px 0 var(--ink);padding-right:max(10px,env(safe-area-inset-right,0px))}
.mcard .ttl{font-size:21px}
.mcard .art{position:absolute;top:-46px;left:50%;transform:translateX(-50%);display:flex;align-items:flex-end;gap:2px}
.mcard .art .cube:nth-child(2){margin-bottom:6px}
.mcard .art svg{width:76px;height:84px;display:block}
.mbar{width:100%;height:26px;border-radius:999px;background:var(--deep);position:relative;display:flex;align-items:center;font-size:16px;font-variant-numeric:tabular-nums}
.mbar>b{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(#ffe45a,var(--yellow))}
.mbar .ic{position:relative;width:30px;height:30px;margin-left:-8px}
.mbar .t{position:relative;flex:1;text-align:center;white-space:nowrap}
.mcard:active{transform:scale(.96)}

/* NAV */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:7;height:calc(74px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--navbg);border-top:3px solid #c6dcff;display:flex;justify-content:space-around;align-items:stretch;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav>button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;position:relative}
.nav>button .ic{width:50px;height:50px;transition:transform .2s cubic-bezier(.2,1.6,.4,1)}
.nav>button .lbl{display:none}
.nav>button.on{background:var(--royal)}
.nav>button.on .ic{transform:translateY(-14px) scale(1.15)}
.nav>button.on .lbl{display:block;margin-top:-12px}
.nav>button .dotn{position:absolute;top:6px;right:18%;width:22px;height:22px;border-radius:50%;background:var(--red);border:2px solid #fff;font-size:14px;font-style:normal;display:grid;place-items:center}
.nav .center{flex:0 0 110px;position:relative}
#playBtn{position:absolute;left:50%;top:-40px;transform:translateX(-50%);width:104px;height:104px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7b0,var(--yellow) 45%,var(--yellowD));border:4px solid var(--ink);box-shadow:inset 0 -8px 0 rgba(0,0,0,.15),0 5px 0 var(--ink);display:grid;place-items:center}
#playBtn:active{transform:translateX(-50%) scale(.92)}
#playBtn svg{width:48px;height:48px}
#playBtn img{width:68px;height:68px}
#playBtn.idle{animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{transform:translateX(-50%) scale(1.06)}}

/* PANNEAUX */
.panel{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 73px);bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:6;background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.08) 0 60px,transparent 61px),radial-gradient(circle at 85% 40%,rgba(255,255,255,.06) 0 80px,transparent 81px),var(--royal);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:16px;padding-bottom:70px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:auto;animation:fade .2s;touch-action:pan-y}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.ribbon{position:relative;display:flex;align-items:center;gap:10px;height:54px;margin:8px 0 16px;padding:0 18px 0 64px;border-radius:14px;border:3px solid #fff;color:var(--ink);font-size:24px;box-shadow:0 0 0 3px var(--ink),0 6px 0 var(--ink)}
.ribbon .cube{position:absolute;left:8px;top:-10px;width:48px;height:48px;transform:rotate(-8deg)}
.ribbon .cnt{margin-left:auto;font-size:24px}
.hgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 18px;margin-bottom:26px}
.hero{display:flex;flex-direction:column;gap:10px;min-width:0}
.hcard{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:18px;border:4px solid #fff;box-shadow:0 0 0 3px var(--ink),0 7px 0 var(--ink);background:linear-gradient(var(--ca,#7fe6ff),var(--cb,#33a6f5));display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16% 4px 6px;transition:transform .12s}
.hcard:active{transform:scale(.94)}
.hcard .cube{width:68%;aspect-ratio:1}
.hcard .lv{font-size:clamp(15px,4.4vw,22px);white-space:nowrap}
.hcard .lv b{font-weight:400;font-size:1.3em}
.hcard.sel{box-shadow:0 0 0 3px var(--ink),0 0 0 9px rgba(170,255,110,.75),0 7px 0 var(--ink)}
.hcard .chk{position:absolute;right:-12px;top:40%;z-index:1;width:38px;height:38px}
.hcard .chk svg{width:20px;height:20px}
.perk{position:absolute;left:-9px;top:-11px;z-index:1;width:38px;height:38px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center}
.perk svg{width:22px;height:22px}
.up{position:absolute;right:-6px;top:-18px;width:38px;height:38px;z-index:1;animation:bob .8s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-5px)}}
.hcard.lock{background:url(ui/card_lock.png) center/100% 100% no-repeat;border:0;box-shadow:none}
.hcard.lock .lk{visibility:hidden}
.hcard.lock .lk svg path:first-child{stroke:#9fb0d6}.hcard.lock .lk rect{fill:#c7d2ea}
.hcard.lock .lk{width:46%;margin-top:6%}
.hcard.lock .lv{font-size:clamp(13px,3.8vw,18px);color:#d5e2ff}
.hbtn{display:flex;flex-direction:column;align-items:center;padding:4px 4px 6px;border-radius:14px;font-size:13px;line-height:1.1}
.hbtn b{font-weight:400;font-size:clamp(16px,4.6vw,22px);display:flex;align-items:center;gap:4px;white-space:nowrap}
.hbtn b .ic{width:22px;height:22px}
.maxed{background:var(--royalD);border-radius:14px;padding:12px 4px;font-size:clamp(13px,3.8vw,18px);text-align:center;display:flex;justify-content:center;align-items:center;gap:4px}
.maxed .ic{width:22px;height:22px}
.hinfo{display:flex;align-items:center;gap:12px;background:var(--royalD);border-radius:16px;padding:10px 14px;margin-bottom:6px}
.hinfo .cube{width:46px;height:46px;flex:none}
.hinfo p{margin:0;font-size:14px;color:var(--muted);line-height:1.25}
.hinfo h3{margin:0;font-size:20px;font-weight:400}
.ptitle{font-size:30px;margin:0 0 14px;font-weight:400;text-align:center}
.box{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:14px}
.box .tx{flex:1;min-width:0}
.box .tx h3{margin:0;font-size:19px;font-weight:400}
.box .tx p{margin:2px 0 0;font-size:14px;color:#4d6bb8}
.mbarw{height:20px;border-radius:999px;background:#d8e6ff;border:2px solid var(--ink);margin-top:6px;overflow:hidden;position:relative}
.mbarw b{position:absolute;inset:0 auto 0 0;background:linear-gradient(#8af06a,var(--greenD))}
.mbarw span{position:relative;display:block;text-align:center;font-size:13px;line-height:16px}
.box .btn{font-size:16px;padding:8px 12px;flex:none;display:flex;align-items:center;gap:4px}
.box .btn .ic{width:20px;height:20px}
.box.done{opacity:.6}
.rico{width:56px;height:56px;flex:none;display:grid;place-items:center;border-radius:14px;background:#e3eeff;border:3px solid var(--ink)}
.rico svg{width:38px;height:38px}
.rico img{width:50px;height:50px}
.rico.big{width:72px;height:72px}.rico.big img{width:66px;height:66px}
.rico .cube{width:40px;height:40px}
.note{font-size:14px;color:var(--muted);text-align:center}

/* LIGUES */
#ranks{position:fixed;inset:0;z-index:9;background:var(--royal);overflow-y:auto;-webkit-overflow-scrolling:touch;pointer-events:auto;animation:fade .2s;touch-action:pan-y}
.ladder{position:relative;padding-top:calc(env(safe-area-inset-top,0px) + 20px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 110px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail{position:absolute;left:max(6px,env(safe-area-inset-left,0px));top:0;bottom:0;width:14px;background:var(--ink)}
.rail b{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(var(--yellow),var(--yellowD))}

/* ===== LOBBY FAÇON BRAWL ===== */
:root{--slate1:#3d4c80;--slate2:#26305c;--slateD:#121a3c}
body[data-r="home"] #bg{background:radial-gradient(ellipse at 50% 45%,#7fe8ff,#2fb4f5 45%,#1677e0 90%)}
body[data-r="home"] .halo{opacity:0}
.lbar{position:fixed;top:0;left:0;right:0;z-index:7;display:flex;align-items:stretch;gap:8px;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));pointer-events:none}
.lbar button{pointer-events:auto}
.lcard{background:linear-gradient(var(--slate1),var(--slate2));border:3px solid var(--slateD);border-radius:12px;box-shadow:0 4px 0 var(--slateD);transition:transform .1s}
.lcard:active,.sbtn:active,.lsq:active,.cpill:active{transform:translateY(3px)}
.prof{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;min-width:0}
.prof .avatar{width:44px;height:44px;border-radius:8px;flex:none}
.prof b{font-weight:400;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22vw}
.troph{display:flex;align-items:stretch;padding:0;overflow:hidden;min-width:0}
.troph .tl{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:4px 10px}
.tv{display:flex;align-items:center;gap:4px}
.tv .ic{width:30px;height:30px}
.tv b{font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.tbar{display:block;width:110px;height:12px;border-radius:99px;background:var(--slateD);overflow:hidden}
.tbar b{display:block;height:100%;background:linear-gradient(#ffb04a,#f2600a)}
.tnext{position:relative;width:58px;background:linear-gradient(#ffe86e,#ffbf1a);display:grid;place-items:center;border-left:3px solid var(--slateD)}
.tnext img,.tnext .cube{width:40px;height:40px}
.tnext .bdg{top:2px;right:2px}
.lcur{margin-left:auto;display:flex;align-items:flex-start;gap:8px}
.cpill{display:flex;align-items:center;gap:4px;background:rgba(10,14,40,.85);border-radius:6px 6px 10px 10px;padding:3px 12px 3px 4px;font-size:20px;height:40px;transition:transform .1s}
.cpill .ic{width:32px;height:32px}
.cpill b{font-weight:400;font-variant-numeric:tabular-nums}
.lsq{width:52px;height:46px;display:grid;place-items:center;background:linear-gradient(var(--slate1),var(--slate2));border:3px solid var(--slateD);border-radius:10px;box-shadow:0 4px 0 var(--slateD)}
.lsq svg{width:30px;height:30px}
.side{position:absolute;top:50%;transform:translateY(-38%);display:flex;flex-direction:column;gap:16px}
.side.left{left:max(10px,env(safe-area-inset-left,0px))}
.side.right{right:max(10px,env(safe-area-inset-right,0px))}
.sbtn{position:relative;width:104px;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px;font-size:15px;background:linear-gradient(var(--slate1),var(--slate2));border:3px solid var(--slateD);border-radius:12px;box-shadow:0 4px 0 var(--slateD);transition:transform .1s}
.sbtn .ic{position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:54px;height:54px}
.bdg{position:absolute;top:-10px;right:-10px;min-width:28px;height:28px;padding:0 6px;border-radius:99px;background:radial-gradient(circle at 40% 35%,#ff7a82,#d4192f);border:3px solid #fff;box-shadow:0 0 0 2px var(--ink);font-style:normal;font-size:15px;display:grid;place-items:center;color:#fff;text-shadow:0 2px 0 var(--ink)}
.plus3d{position:absolute;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:12px;background:rgba(255,255,255,.28);border:4px solid rgba(255,255,255,.9);box-shadow:0 5px 0 rgba(18,42,107,.35);color:#fff;font-size:52px;line-height:60px;display:grid;place-items:center;transform:rotate(-4deg);transition:transform .1s;text-shadow:0 3px 0 rgba(18,42,107,.4)}
.plus3d:active{transform:rotate(-4deg) scale(.9)}
.heroTag{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translateX(-50%);display:flex;align-items:stretch;border:3px solid var(--slateD);border-radius:10px;overflow:hidden;box-shadow:0 4px 0 var(--slateD);white-space:nowrap}
.heroTag span{display:flex;align-items:center;gap:4px;padding:2px 10px;font-size:18px}

.heroTag .hl{background:linear-gradient(#ffb04a,#f2600a)}
.heroTag .hp{background:#fff;color:var(--ink);text-shadow:none;font-size:14px}
.heroTag .hp svg{width:20px;height:20px}
.lbottom{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.passc{position:relative;display:flex;flex-direction:column;gap:6px;padding:10px 12px 10px;background:linear-gradient(#ffe86e,#ffbf1a);border:3px solid var(--slateD);border-radius:14px;box-shadow:0 5px 0 var(--slateD);text-align:left;transition:transform .1s;min-width:0}
.passc:active,.modec:active{transform:translateY(3px)}
.pimg{position:absolute;left:8px;top:-34px;width:70px;height:56px;transform:rotate(-12deg)}
.pttl{font-size:24px;padding-left:76px;line-height:1}
.pbar{display:flex;align-items:center;gap:6px}
.pb{position:relative;flex:1;height:24px;border-radius:99px;background:#5a3a10;border:2px solid var(--slateD);overflow:hidden}
.pb b{position:absolute;inset:0 auto 0 0;background:linear-gradient(#ffb04a,#f2600a)}
.pb em{position:relative;display:block;text-align:center;font-style:normal;font-size:15px;line-height:20px}
.plv{width:40px;height:40px;flex:none;border-radius:50%;background:radial-gradient(circle at 40% 35%,#6a5a3a,#3a2a10);border:3px solid var(--slateD);display:grid;place-items:center;font-size:22px}
.modec{display:flex;flex-direction:column;border:3px solid var(--slateD);border-radius:12px;overflow:hidden;box-shadow:0 5px 0 var(--slateD);text-align:left;background:linear-gradient(var(--slate1),var(--slate2));transition:transform .1s;min-width:0}
.mstrip{display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--slateD);padding:3px 10px;font-size:13px;color:#b9c6ea}
.mi{width:22px;height:22px;border-radius:50%;background:#2a7cf0;border:2px solid #fff;display:grid;place-items:center;font-size:13px;color:#fff;flex:none}
.mbody{display:flex;align-items:center;gap:10px;padding:8px}
.mimg{width:60px;height:60px;flex:none;border-radius:10px;display:grid;place-items:center;border:2px solid rgba(255,255,255,.6)}
.mimg img{width:46px;height:46px}
.mtx{display:flex;flex-direction:column;min-width:0}
.mtx b{font-weight:400;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtx em{font-style:normal;font-size:14px;color:#9cf05a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.playc{display:flex;flex-direction:column;gap:0;min-width:0}
.pstrip{background:var(--slateD);border-radius:10px 10px 0 0;padding:3px 10px;font-size:13px;color:#b9c6ea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.pstrip .ic{width:18px;height:18px}
.playbtn{min-height:84px;font-size:38px;width:100%}
@media (orientation:portrait),(max-width:720px){
 .prof b{display:none}.prof{padding:3px}
 .tbar{width:72px}
 .cpill{font-size:16px;height:36px;padding-right:8px}.cpill .ic{width:26px;height:26px}
 .lsq{width:42px;height:40px}
 .side{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 214px);transform:none;gap:12px}
 .sbtn{width:68px;height:52px;font-size:11px}.sbtn .ic{width:40px;height:40px;top:-18px}
 .heroTag{top:calc(env(safe-area-inset-top,0px) + 68px)}
 .lbottom{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"pass mode" "play play";gap:10px 10px}
 .passc{grid-area:pass}.modec{grid-area:mode}.playc{grid-area:play}
 .pimg{width:52px;height:42px;top:-26px}.pttl{font-size:18px;padding-left:54px}
 .mimg{width:44px;height:44px}.mimg img{width:34px;height:34px}.mtx b{font-size:16px}.mtx em{font-size:12px}.mbody{padding:6px}
 .playbtn{min-height:68px;font-size:32px}
 .plus3d{width:58px;height:58px;margin:-29px 0 0 -29px;font-size:40px}
}
/* ===== ÉCRANS ===== */
.scr{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;background:radial-gradient(circle,rgba(255,255,255,.06) 0 34px,transparent 35px) 0 0/150px 150px,radial-gradient(circle,rgba(255,255,255,.05) 0 22px,transparent 23px) 75px 75px/150px 150px,linear-gradient(#2a5ce8,#1a3ab8);pointer-events:auto;animation:fade .18s}
.shead{flex:none;display:flex;align-items:flex-start;gap:12px;padding-top:env(safe-area-inset-top,0px);padding-right:max(0px,env(safe-area-inset-right,0px));background:linear-gradient(rgba(10,14,40,.9),rgba(10,14,40,.6))}
.hb{flex:none;width:68px;height:54px;display:grid;place-items:center;background:linear-gradient(var(--slate1),var(--slate2));border:3px solid var(--slateD);box-shadow:0 4px 0 var(--slateD);transition:transform .1s}

.sbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding-top:16px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

function tone(f,d=.12,type='sine',v=.15,f2=null,delay=0){if(!AC||save.muted)return;const a=AC,t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}

function nearestTrail(o,e){let b=-1,bd=1e9;for(const c of o.trailCells){const dx=c%N+.5-e.x,dz=((c/N)|0)+.5-e.z,d=dx*dx+dz*dz;if(d<bd){bd=d;b=c}}return[b,Math.sqrt(bd)]}

  if(!home&&tl>0)setReturn(e);
  else{e.targetH+=(Math.random()-.5)*dt*4;if(!home)e.targetH=Math.atan2(e.hz-e.z,e.hx-e.x);

   }}
 }

 LG.forEach((L,i)=>{if(!i)return;let x;if(L.t<=ROAD[0].t)x=P0+(L.t/ROAD[0].t)*(xs[0]-P0);else{x=xs[xs.length-1];for(let k=0;k<ROAD.length-1;k++)if(L.t>=ROAD[k].t&&L.t<ROAD[k+1].t){x=xs[k]+(L.t-ROAD[k].t)/(ROAD[k+1].t-ROAD[k].t)*W;break}}

 if(b.hasAttribute('data-pslot')){const i=$('#fIn');if(i)i.focus();toast('Ajoute ou invite un ami ci-dessous');return}
 if(b.hasAttribute('data-fadd')){const v=($('#fIn').value||'').trim().slice(0,16);if(!v){toast('Écris le pseudo de ton ami');return}if(save.friends.some(f=>f.toLowerCase()===v.toLowerCase())){toast('Déjà dans tes amis');return}save.friends.push(v);persist();toast(`${v} ajouté à tes amis`);renderParty();return}
 if(b.dataset.finv){const f=save.friends[+b.dataset.finv];if(groupInv.length<3&&!groupInv.includes(f)){groupInv.push(f);toast(`Invitation envoyée à ${f}`)}renderParty();return}
 if(b.dataset.fdel){const f=save.friends[+b.dataset.fdel];save.friends.splice(+b.dataset.fdel,1);groupInv=groupInv.filter(x=>x!==f);persist();renderParty();return}
 if(b.hasAttribute('data-pcreate')){roomCode=newCode();sfx.up();renderParty();return}
 if(b.hasAttribute('data-pcopy')){const t=roomCode;try{navigator.clipboard.writeText(t).then(()=>toast('Code copié !'),()=>toast('Code : '+t))}catch(_){toast('Code : '+t)}return}
 if(b.hasAttribute('data-proom')){matchmake(`SALON ${roomCode}`,"Personne n'a encore rejoint : partie contre des bots.",()=>startGame('casual'));return}
 if(b.hasAttribute('data-pjoin')){const c=($('#codeIn').value||'').trim().toUpperCase();if(c.length!==6){toast('Le code fait 6 caractères');return}toast(`Salon ${c} introuvable : le jeu en ligne n'est pas encore branché`);return}
 if(b.hasAttribute('data-ponline')){matchmake('RECHERCHE DE JOUEURS…',"Aucun joueur en ligne pour l'instant : partie contre des bots.",()=>startGame('casual'));return}
});

// LOBBY : boutons
document.querySelectorAll('[data-go]').forEach(b=>press(b,()=>{const t=b.dataset.go;if(t==='room')openParty(true);else go(t)}));
press($('#plusL'),()=>go('party'));press($('#plusR'),()=>go('party'));
press($('#trophyBtn'),()=>go('road'));press($('#passCard'),()=>go('pass'));press($('#modeBtn'),()=>go('modes'));
press($('#playGo'),()=>{const m=save.mode;if(m==='ranked')startGame('ranked');else if(m==='quick')startGame('casual');else openParty(m==='room')});
press($('#coinPill'),()=>{shopTab='res';go('shop')});press($('#gemPill'),()=>{shopTab='res';go('shop')});
press($('#gearBtn'),openSettings);press($('#profileBtn'),openSettings);
function openSettings(){$('#nameIn').value=save.name;$('#settings').hidden=false}
press($('#soundBtn'),()=>{save.muted=!save.muted;persist();updTop()});
press($('#setClose'),()=>{save.name=($('#nameIn').value.trim()||'Joueur').slice(0,12);persist();$('#settings').hidden=true;updTop()});
$('#nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('#setClose').click()});
press($('#againBtn'),()=>startGame(gameMode));
press($('#homeBtn'),goHome);
function goHome(){state='menu';$('#end').hidden=true;$('#hud').hidden=true;for(const e of ents)e.view.g.visible=false;snapCam=true;go('home')}
setInterval(()=>{if(state==='menu'&&tab==='home')$('#mTimer').textContent='Nouveaux défis dans '+untilMidnight()},30000);

fillIcons();$('#gearBtn').innerHTML=I.menu;$('#dPrev').innerHTML=I.chevL;$('#dNext').innerHTML=I.chevR;
snapCam=true;go('home');
requestAnimationFrame(frame);
})();
